<!doctype html>
<html><head><meta charset="utf-8"><title>thumb helper</title>
<style>html,body{margin:0;overflow:hidden;background:#ECEBE6}iframe{position:absolute;left:-40px;border:0;width:1480px;height:3000px}</style></head>
<body><iframe id="f"></iframe>
<script>
// Used only by tools/make_thumbs.py: frames a theme sheet so the screenshot shows just its 4-cell grid.
const f = document.getElementById("f");
const name = new URLSearchParams(location.search).get("f") || "";
if (/^\d{3}-[a-z0-9-]+\.html$/.test(name)) f.src = "themes/" + name;   // only local theme sheets, nothing else
f.onload = () => { const g = f.contentDocument && f.contentDocument.querySelector(".grid"); if (g) f.style.top = -(g.getBoundingClientRect().top) + "px"; };
</script></body></html>
